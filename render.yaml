# Render Blueprint — 가장 쉬운 무료 배포 경로
# 사용법: GitHub에 올린 뒤 render.com > New > Blueprint 에서 이 저장소 선택.
# (환경변수 GEMINI_API_KEY 등은 Render 대시보드에서 입력 — 코드에 넣지 않음)
services:
  - type: web
    name: gene-platform
    runtime: node
    rootDir: server          # server 폴더를 앱 루트로 (정적 ../public 도 함께 서빙)
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # 어떤 LLM으로 분석할지: gemini 또는 openai(GPT)
      - key: LLM_PROVIDER
        value: openai
      # ── Gemini 사용 시 ──
      - key: GEMINI_API_KEY
        sync: false          # 대시보드에서 직접 입력 (비밀값)
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # ── GPT(OpenAI) 사용 시: LLM_PROVIDER 를 openai 로 바꾸고 아래 입력 ──
      - key: OPENAI_API_KEY
        sync: false          # 대시보드에서 직접 입력 (비밀값)
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SUPABASE_URL
        sync: false          # 2단계(로그인) 쓸 때만 입력
      - key: SUPABASE_ANON_KEY
        sync: false
